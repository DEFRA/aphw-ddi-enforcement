---
environment: production
environmentCode: pre
container:
  messageQueueHost: PREFFCINFSB1001.servicebus.windows.net
  openidDiscoveryEndpoint: https://oidc.integration.account.gov.uk/.well-known/openid-configuration
  osPlacesBaseUrl: https://api.os.uk/search/places/v1
  redisHostname: PREFFCINFRD1001.redis.cache.windows.net
  redisPort: 6380
  documentRequestQueue: aphw-ddi-certificate-request
  ddiApiBaseUrl: http://aphw-ddi-api.aphw-ddi-pre
  ddiEventsBaseUrl: http://aphw-ddi-events.aphw-ddi-pre
  postLogoutUrl: https://aphw-ddi-enforcement-pre.azure.defra.cloud/post-logout
  redirectUrl: https://aphw-ddi-enforcement-pre.azure.defra.cloud/authenticate
ingress:
  server: azure.defra.cloud
  endpoint: aphw-ddi-enforcement-pre
secretProviderClass:
  azure:
    keyvaultName: PREFFCINFKV1001
    objects:
      - objectName: pre-ffcahwr-appinsights-connectionString
        objectType: secret
      - objectName: PRE-aphw-ddi-enforcement-openid-client-id
        objectType: secret
      - objectName: PRE-aphw-ddi-enforcement-openid-private-key
        objectType: secret
      - objectName: PRE-aphw-ddi-enforcement-openid-public-key
        objectType: secret
      - objectName: PRE-aphw-ddi-enforcement-jwt-private-key
        objectType: secret
      - objectName: PRE-aphw-ddi-os-places-key
        objectType: secret
      - objectName: pre-redisPassword
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-enforcement
      type: Opaque
      data:
        - objectName: pre-ffcahwr-appinsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: PRE-aphw-ddi-enforcement-openid-client-id
          key: OPENID_CLIENT_ID
        - objectName: PRE-aphw-ddi-enforcement-openid-private-key
          key: OPENID_PRIVATE_KEY
        - objectName: PRE-aphw-ddi-enforcement-openid-public-key
          key: OPENID_PUBLIC_KEY
        - objectName: PRE-aphw-ddi-enforcement-jwt-private-key
          key: JWT_PRIVATE_KEY
        - objectName: PRE-aphw-ddi-os-places-key
          key: OS_PLACES_API_KEY
        - objectName: pre-redisPassword
          key: REDIS_PASSWORD
