---
environment: production
environmentCode: prd
container:
  messageQueueHost: PRDFFCINFSB1001.servicebus.windows.net
  openidDiscoveryEndpoint: https://oidc.account.gov.uk/.well-known/openid-configuration
  osPlacesBaseUrl: https://api.os.uk/search/places/v1
  redisHostname: PRDFFCINFRD1001.redis.cache.windows.net
  redisPort: 6380
  documentRequestQueue: aphw-ddi-certificate-request
  ddiApiBaseUrl: http://aphw-ddi-api.aphw-ddi-prd
  ddiEventsBaseUrl: http://aphw-ddi-events.aphw-ddi-prd
  postLogoutUrl: https://dogsindex.defra.gov.uk/post-logout
  redirectUrl: https://dogsindex.defra.gov.uk/authenticate
ingress:
  server: defra.gov.uk
  endpoint: dogsindex
secretProviderClass:
  azure:
    keyvaultName: PRDFFCINFKV1001
    objects:
      - objectName: prd-ffcahwr-appinsights-connectionString
        objectType: secret
      - objectName: PRD-aphw-ddi-enforcement-openid-client-id
        objectType: secret
      - objectName: PRD-aphw-ddi-enforcement-openid-private-key
        objectType: secret
      - objectName: PRD-aphw-ddi-enforcement-openid-public-key
        objectType: secret
      - objectName: PRD-aphw-ddi-enforcement-jwt-private-key
        objectType: secret
      - objectName: prd-aphw-ddi-os-places-key
        objectType: secret
      - objectName: prd-redisPassword
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-enforcement
      type: Opaque
      data:
        - objectName: prd-ffcahwr-appinsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: PRD-aphw-ddi-enforcement-openid-client-id
          key: OPENID_CLIENT_ID
        - objectName: PRD-aphw-ddi-enforcement-openid-private-key
          key: OPENID_PRIVATE_KEY
        - objectName: PRD-aphw-ddi-enforcement-openid-public-key
          key: OPENID_PUBLIC_KEY
        - objectName: PRD-aphw-ddi-enforcement-jwt-private-key
          key: JWT_PRIVATE_KEY
        - objectName: prd-aphw-ddi-os-places-key
          key: OS_PLACES_API_KEY
        - objectName: prd-redisPassword
          key: REDIS_PASSWORD
