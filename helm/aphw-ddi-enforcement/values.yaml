environment: production
environmentCode:
name: aphw-ddi-enforcement
namespace: aphw-ddi
workstream: aphw-ddi
image: aphw-ddi-enforcement

labels:
  component: service

appInsights:
  connectionString:

containerConfigMap:
  name: aphw-ddi-enforcement

containerSecret:
  name: aphw-ddi-enforcement

deployment:
  replicas: 1
  minReplicas: 1
  maxReplicas: 10
  cpuThreshold: 80
  memoryThreshold: 400Mi

container:
  requestMemory: 200Mi
  requestCpu: 100m
  limitMemory: 500Mi
  limitCpu: 200m
  port: 3000
  cookiePassword: who-likes-cookies-i-like-cookies-everybody-likes-cookies
  ddiApiBaseUrl: ddi-index-api-base-url
  ddiEventsBaseUrl: ddi-events-api-base-url
  osPlacesBaseUrl: os-places-api-base-url
  openidDiscoveryEndpoint: discovery-endpoint
  azureStorageUseConnectionString: false
  azureStorageAccountName: dummy
  messageQueueHost: namespace.servicebus.windows.net
  documentRequestQueue: aphw-ddi-certificate-request
  postLogoutUrl: post-logout
  redirectUrl: authenticate
  redisHostname: dummy
  redisPort: 6379

livenessProbe:
  path: /healthz
  port: 3000
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  path: /healthy
  port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

workloadIdentity: true

azureIdentity:
  clientID: not-a-real-clientID
  resourceID: not-a-real-resourceID

ingress:
  class: nginx
  endpoint: ffc-pay-request-editor
  server: example.com

service:
  port: 80
  type: ClusterIP

secretProviderClass:
  azure:
    keyvaultName: SNDFFCINFKV2001
    objects:
      - objectName: snd2-aphw-appinsights-connectionString
        objectType: secret
      - objectName: snd2-aphw-ddi-simulator-openid-client-id
        objectType: secret
      - objectName: snd2-aphw-ddi-enforcement-openid-private-key
        objectType: secret
      - objectName: snd2-aphw-ddi-enforcement-openid-public-key
        objectType: secret
      - objectName: snd2-aphw-ddi-enforcement-jwt-private-key
        objectType: secret
      - objectName: snd2-aphw-ddi-os-places-key
        objectType: secret
      - objectName: snd2-redisPassword
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-enforcement
      type: Opaque
      data:
        - objectName: snd2-aphw-appinsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: snd2-aphw-ddi-simulator-openid-client-id
          key: OPENID_CLIENT_ID
        - objectName: snd2-aphw-ddi-enforcement-openid-private-key
          key: OPENID_PRIVATE_KEY
        - objectName: snd2-aphw-ddi-enforcement-openid-public-key
          key: OPENID_PUBLIC_KEY
        - objectName: snd2-aphw-ddi-enforcement-jwt-private-key
          key: JWT_PRIVATE_KEY
        - objectName: snd2-aphw-ddi-os-places-key
          key: OS_PLACES_API_KEY
        - objectName: snd2-redisPassword
          key: REDIS_PASSWORD
